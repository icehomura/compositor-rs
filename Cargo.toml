[workspace]
resolver = "2"
members = [
    "crates/compositor-core",
    "crates/compositor-pixels",
    "crates/compositor-render",
    "crates/compositor-session",
    "crates/compositor-io",
    "crates/compositor-ui",
    "crates/compositor-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/robbietilton/Compositor"

[workspace.dependencies]
compositor-core = { path = "crates/compositor-core" }
compositor-pixels = { path = "crates/compositor-pixels" }
compositor-render = { path = "crates/compositor-render" }
compositor-session = { path = "crates/compositor-session" }
compositor-io = { path = "crates/compositor-io" }

uuid = { version = "1", features = ["v4", "v5", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
thiserror = "2"
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }
png = "0.17"
flate2 = "1"
half = "2"
notify = "8"
rustc-hash = "2"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
num_cpus = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

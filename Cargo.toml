[workspace]
resolver = "2"
members = [
    "crates/compositor-rs-core",
    "crates/compositor-rs-pixels",
    "crates/compositor-rs-render",
    "crates/compositor-rs-session",
    "crates/compositor-rs-io",
    "crates/compositor-rs-ui",
    "crates/compositor-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/robbietilton/Compositor"

[workspace.dependencies]
compositor-rs-core = { path = "crates/compositor-rs-core" }
compositor-rs-pixels = { path = "crates/compositor-rs-pixels" }
compositor-rs-render = { path = "crates/compositor-rs-render" }
compositor-rs-session = { path = "crates/compositor-rs-session" }
compositor-rs-io = { path = "crates/compositor-rs-io" }
compositor-rs-ui = { path = "crates/compositor-rs-ui" }
compositor-rs = { path = "crates/compositor-rs" }

uuid = { version = "1", features = ["v4", "v5", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
thiserror = "2"
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }
png = "0.17"
flate2 = "1"
half = "2"
notify = "8"
rustc-hash = "2"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
num_cpus = "1"
fontdue = "0.9"
fontdb = "0.24"
resvg = "0.48"
usvg = "0.48"
rawler = "0.8"
tiny-skia = "0.12"
sha2 = "0.10"
clipper2 = "0.6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
